name: Feature request
description: Suggest a component, a prop or an improvement
labels: [enhancement]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        [
          '@axon/theme',
          '@axon/core',
          '@axon/forms',
          '@axon/chat',
          '@axon/charts',
          '@axon/table',
          'New package',
          'Not sure',
        ]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem first, before the solution. What can't you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: The API you have in mind, if any, and how it should behave from the keyboard and with a screen reader.
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried?
